# Lower the upstream memory requests (500-800Mi each) so the stack schedules
# next to other workloads on one node. Limits are left unset as upstream.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ml-pipeline
  namespace: kubeflow
spec:
  template:
    spec:
      containers:
      - name: ml-pipeline-api-server
        resources:
          requests:
            cpu: 100m
            memory: 192Mi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ml-pipeline-persistenceagent
  namespace: kubeflow
spec:
  template:
    spec:
      containers:
      - name: ml-pipeline-persistenceagent
        resources:
          requests:
            cpu: 20m
            memory: 64Mi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ml-pipeline-visualizationserver
  namespace: kubeflow
spec:
  template:
    spec:
      containers:
      - name: ml-pipeline-visualizationserver
        resources:
          requests:
            cpu: 10m
            memory: 128Mi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mysql
  namespace: kubeflow
spec:
  template:
    spec:
      containers:
      - name: mysql
        resources:
          requests:
            cpu: 50m
            memory: 384Mi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: workflow-controller
  namespace: kubeflow
spec:
  template:
    spec:
      containers:
      - name: workflow-controller
        resources:
          requests:
            cpu: 50m
            memory: 128Mi
